<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The theme follows the system until the user overrides it, so ship both
         colours and let the browser pick before React mounts. AppShell then
         collapses these onto the active theme (see state/theme.ts). Values
         mirror --bg in src/ui/styles/tokens.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0efec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211" />
    <title>Chronoscope</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
