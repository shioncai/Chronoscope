<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Chronoscope">
  <!-- Three event glyphs on one axis, in the timeline's own vocabulary
       (renderer.ts draws spans with fillRect, so these are square-cornered).
       Lengths fall away and the right edges step evenly, so the eye descends
       from an era to a moment; the top bar runs off the left edge because deep
       time is wider than the view.

       Every coordinate is a multiple of 16 — that is 1px at a 16px render and
       2px at 32px, so the bars land on whole pixels instead of dissolving into
       grey. Bar height 28 washed out at 16px; 32 does not. Keep the grid. -->
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#121211"/>
    <g fill="#e8e6e1">
      <rect x="-16" y="48" width="192" height="32"/>
      <rect x="80" y="112" width="112" height="32"/>
      <rect x="144" y="176" width="64" height="32"/>
    </g>
  </g>
</svg>
