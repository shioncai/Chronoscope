<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Chronoscope">
  <!-- Android adaptive-icon FOREGROUND. No tile: the background layer supplies
       the paper, and drawing one here would nest a tile inside the launcher's
       own shape.

       Android only guarantees the central 66.7% of this layer survives the mask
       (a circle in the worst case, so safe radius = 85.3 on this 256 viewBox).
       The maskable PWA variant is cut for an 80% safe zone and is NOT tight
       enough: its bottom bar's far corner sits at r=113 and would lose a corner.
       Scaling the glyphs by 0.75 about the centre puts that corner at r=84.8.

       The top bar is the exception — it is *meant* to run off the left edge, so
       instead of scaling it in, its left edge is pushed off-canvas and the mask
       does the cropping, under a circular and a squircle mask alike. -->
  <g fill="#6c5649">
    <rect x="-20" y="68" width="184" height="24"/>
    <rect x="92" y="116" width="84" height="24"/>
    <rect x="140" y="164" width="48" height="24"/>
  </g>
</svg>
