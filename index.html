<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the SVG and paints transparency black, so it gets its own
         opaque square PNG. Both are generated by scripts/make-icon.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values; without it Android and iOS report 0 and the top bar renders
         underneath the status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The theme follows the system until the user overrides it, so ship both
         colours and let the browser pick before React mounts. AppShell then
         collapses these onto the active theme (see state/theme.ts). Values
         mirror --bg in src/ui/styles/tokens.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0efec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211" />
    <title>Chronoscope</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
